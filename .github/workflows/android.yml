name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS=$(find . -path './.git' -prune -o -name settings.gradle.kts -print -quit)
          if [ -z "$SETTINGS" ]; then
            ZIP="./SubtleUnlockWallpaper_0.1.5_ClaudeBase.zip"
            if [ ! -f "$ZIP" ]; then echo "Expected source ZIP $ZIP was not found"; exit 1; fi
            mkdir -p extracted-project
            unzip -q "$ZIP" -d extracted-project
            SETTINGS=$(find extracted-project -name settings.gradle.kts -print -quit)
          fi
          if [ -z "$SETTINGS" ]; then echo "settings.gradle.kts not found"; exit 1; fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          test -f "$PROJECT_DIR/app/build.gradle.kts"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Run source and geometry checks
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 tools/feature_checks.py
          python3 tools/static_checks.py
          python3 tools/verify_geometry.py
          python3 tools/verify_blur.py

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle testDebugUnitTest --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SubtleUnlockWallpaper-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
